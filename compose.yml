name: hom-system-local

networks:
  hom-system:
    name: hom-system
    driver: bridge

volumes:
  pgsql-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

services:
  backend:
    # Dev image lives here, not in the submodule: gym-backend/Dockerfile is the
    # production Octane build. Local runs `php artisan serve` over the bind mount so
    # edits apply on the next request — no rebuild, no restart.
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.2"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
        USER: hom
        TZ: Asia/Jakarta
    image: hom-backend:local
    container_name: hom-backend-app
    restart: unless-stopped
    working_dir: /var/www/app
    # `artisan serve` only forwards a whitelist of env vars to the PHP dev server, so
    # the app config comes from .env (seeded from docker/backend/env.local), not from
    # `environment:` here.
    command: >
      sh -c "
        [ -f .env ] || cp /srv/env.local .env;
        [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist;
        grep -q '^APP_KEY=base64' .env || php artisan key:generate --force;
        php artisan config:clear;
        php artisan migrate --force || true;
        php artisan serve --host=0.0.0.0 --port=8000
      "
    ports:
      - "8881:8000"
    environment:
      # Only used by artisan/composer invoked via `docker compose exec`.
      APP_ENV: local
      COMPOSER_MEMORY_LIMIT: "-1"
    volumes:
      - ./gym-backend:/var/www/app
      - ./docker/backend/env.local:/srv/env.local:ro
    networks:
      - hom-system
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Queue worker — same image/mounts, just a different command.
  # Start it explicitly: docker compose --profile workers up -d
  queue:
    extends:
      service: backend
    container_name: hom-backend-queue
    profiles: ["workers"]
    ports: []
    command: >
      sh -c "
        [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist;
        php artisan queue:work --sleep=3 --tries=3
      "
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    extends:
      service: backend
    container_name: hom-backend-scheduler
    profiles: ["workers"]
    ports: []
    command: >
      sh -c "
        [ -f vendor/autoload.php ] || composer install --no-interaction --prefer-dist;
        php artisan schedule:work
      "
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgsql:
    image: postgres:17
    container_name: hom-pgsql
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: hom
      POSTGRES_USER: hom
      POSTGRES_PASSWORD: secret
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    networks:
      - hom-system
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hom", "-d", "hom"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: hom-redis
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data
    networks:
      - hom-system
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: hom-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # smtp
    networks:
      - hom-system

  minio:
    image: minio/minio
    container_name: hom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: hom
      MINIO_ROOT_PASSWORD: hom-secret
    volumes:
      - minio-data:/data
    networks:
      - hom-system
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: creates the local bucket so the backend's s3 disk has somewhere to
  # write on first boot. Exits after running; not a long-lived service.
  minio-init:
    image: minio/mc
    container_name: hom-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - hom-system
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 hom hom-secret;
        mc mb --ignore-existing local/hom-local;
        mc anonymous set download local/hom-local;
      "

  # Nuxt 3 admin (SPA). Its own Dockerfile is a production build, so local dev just
  # runs `yarn dev` on a plain node image over the bind mount.
  frontend:
    image: node:22-slim
    container_name: hom-frontend
    restart: unless-stopped
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      sh -c "
        [ -d node_modules ] || yarn install --frozen-lockfile --ignore-engines;
        yarn dev --host 0.0.0.0 --port 3000
      "
    ports:
      - "3000:3000"
    environment:
      # Nitro proxies /api/** server-side and strips the /api prefix, and the admin
      # repositories call bare paths ("branch", "auth/login"), so the CMS base belongs
      # here: /api/branch -> http://backend:8000/cms/v1/branch.
      BACKEND_API_URL: http://backend:8000/cms/v1
      APP_URL: http://localhost:3000
      NUXT_SESSION_PASSWORD: local-dev-session-password-change-me-32
      NUXT_GOOGLEMAPS_API_KEY: ""
      NUXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./gym-frontend:/app
    networks:
      - hom-system
    depends_on:
      - backend
